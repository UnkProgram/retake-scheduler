[project]
name = "retake-scheduler"
version = "0.1.0"
description = "Веб-сервис автоматического составления расписания пересдач и защит"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
