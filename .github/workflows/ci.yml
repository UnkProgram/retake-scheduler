name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Проверка стиля (Ruff)
        run: ruff check .

      - name: Тесты (pytest)
        run: |
          pytest -q || { code=$?; [ "$code" -eq 5 ] || exit "$code"; }
